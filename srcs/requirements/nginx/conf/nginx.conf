events {
}

http {
    server {
        # No port 80 listener: HTTPS only.
        listen 443 ssl;

        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # Only versions accepted by the project.
        ssl_protocols TLSv1.2 TLSv1.3;

        server_name _;

        # Same WordPress volume mounted by both services.
        root /var/www/html;

        index index.php index.html;

        location / {
            # If the file doesn't exist, WordPress handles the request.
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;

            # Tell PHP-FPM which PHP file it must execute.
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Docker DNS resolves "wordpress" to its container.
            fastcgi_pass wordpress:9000;
        }
    }
}
